name: Release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm test
      - name: Verify the card version
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { CARD_VERSION } from "./dreame-open-card.js";
            assert.equal(CARD_VERSION, process.env.GITHUB_REF_NAME);
          '
      - name: Upload the installable JavaScript module
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dreame-open-card.js --clobber
