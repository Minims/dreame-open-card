name: Release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm test
      - name: Verify the card version
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { CARD_VERSION } from "./dreame-open-card.js";
            assert.equal(CARD_VERSION, process.env.GITHUB_REF_NAME);
          '
      - name: Upload the installable JavaScript module
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dreame-open-card.js --clobber
