<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structured map fixture</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 12px; }
  dreame-open-card { display: block; margin: auto; }
</style>
<script type="module">
  import "/dreame-open-card.js";

  const params = new URLSearchParams(location.search);
  const dark = params.has("dark");
  const card = document.querySelector("dreame-open-card");
  const calls = [];
  const vacuum = "vacuum.fixture", camera = "camera.fixture_map";
  const calibration = [
    { vacuum: { x: 100, y: 200 }, map: { x: 20, y: 260 } },
    { vacuum: { x: 900, y: 200 }, map: { x: 380, y: 260 } },
    { vacuum: { x: 100, y: 700 }, map: { x: 20, y: 30 } },
  ];
  const config = { entity: vacuum, map_camera: camera, map_display: "structured",
    mode: params.has("panel") ? "panel" : "default", color_scheme: dark ? "dreame_dark" : "dreame_light" };
  const width = Number(params.get("width"));
  card.style.maxWidth = `${[320, 500, 1000].includes(width) ? width : params.has("panel") ? 1000 : 380}px`;
  document.body.style.background = dark ? "#222" : "#f1f4f7";
  card.setConfig(config);

  function update(frame = 42, floor = 7, restrictions = {}) {
    card.hass = {
      locale: { language: "en" },
      themes: { darkMode: dark },
      entities: {
        [vacuum]: { device_id: "robot" },
        [camera]: { device_id: "robot", platform: "dreame_vacuum", translation_key: "map" },
        "select.fixture_cleaning_mode": { device_id: "robot", platform: "dreame_vacuum", translation_key: "cleaning_mode" },
        "select.fixture_suction_level": { device_id: "robot", platform: "dreame_vacuum", translation_key: "suction_level" },
      },
      states: {
        [vacuum]: { state: "docked", attributes: { friendly_name: "Fixture vacuum", battery_level: 82,
          selected_map_id: floor, maps: [{ id: 7, name: "Downstairs" }, { id: 8, name: "Upstairs" }],
          shortcuts: { 25: { id: 25, name: "Kitchen", tasks: [[{ segment_id: 2 }]] } },
          schedule: [{ id: 1, enabled: true, time: "07:30" }] } },
        [camera]: { state: "idle", attributes: { saved_map_id: floor, map_id: floor * 10 + 1, frame_id: frame,
          entity_picture: `/api/camera_proxy/${camera}?v=${frame}`, calibration_points: calibration,
          cruising_history_picture: { "Cruise fixture": `/api/camera_history_map_proxy/${camera}?v=1234` },
          virtual_walls: [[450, 250, 450, 650]], no_go_areas: [[200, 300, 300, 400]], no_mopping_areas: [],
          rooms: { 1: { name: "Living room", icon: "mdi:sofa-outline", x0: 150, x1: 400, y0: 250, y1: 650,
             cleaning_times: 1, suction_level: 2, water_volume: 1, cleaning_mode: 2, mop_pressure: "Normal" },
            2: { name: "Kitchen", icon: "mdi:stove", x0: 500, x1: 850, y0: 250, y1: 650,
            cleaning_times: 2, suction_level: 3, water_volume: 2, cleaning_mode: 1 } }, ...restrictions } },
        "script.sweep": { state: "off", attributes: { friendly_name: "Sweep helper" } },
        "script.quiet": { state: "off", attributes: { friendly_name: "Quiet helper" } },
        "switch.fixture_customized_cleaning": { state: "on", attributes: { friendly_name: "Customized cleaning" } },
        "select.fixture_cleaning_mode": { state: "sweeping_and_mopping",
          attributes: { friendly_name: "Fixture Cleaning mode", options: ["sweeping", "mopping", "sweeping_and_mopping"] } },
        "select.fixture_suction_level": { state: "standard",
          attributes: { friendly_name: "Fixture Suction level", options: ["quiet", "standard", "strong", "turbo"] } },
      },
      services: {
        vacuum: { start: {}, return_to_base: {} },
        script: { turn_on: {} },
        switch: { turn_on: {}, turn_off: {} },
        select: { select_option: {} },
        dreame_vacuum: Object.fromEntries(["clean_segment", "clean_spot", "clean_zone", "goto",
          "set_restricted_zone", "remote_control_move_step", "start_shortcut", "select_map", "rename_segment", "set_custom_cleaning"].map(name => [`vacuum_${name}`, {}])),
      },
      callService: async (domain, service, payload, target) => { calls.push({ domain, service, payload, target }); },
    };
  }

  window.fixture = { card, calls, update };
  update();

  if (params.has("matrix")) {
    const output = document.querySelector("output");
    const root = card.shadowRoot;
    const el = id => root.getElementById(id);
    const check = (condition, label) => { if (!condition) throw new Error(label); };
    const waitFor = async condition => {
      for (let frame = 0; frame < 180; frame++) {
        if (condition()) return;
        await new Promise(requestAnimationFrame);
      }
      throw new Error("Fixture map did not settle");
    };
    const setVacuum = (state, attrs = {}, entities = {}, services = {}) => {
      const hass = card.ha;
      card.hass = { ...hass, states: { ...hass.states, ...entities, [vacuum]: {
        state, attributes: { ...hass.states[vacuum].attributes, ...attrs },
      } }, services: { ...hass.services, ...services } };
    };
    try {
      await waitFor(() => !el("structured-map").hidden);
      check(el("map").naturalWidth === 400, "Calibrated image does not match the fixture");
      check(el("basic").querySelector('[data-action="vacuum.return_to_base"]'), "Simple robot must offer direct return");
      check(el("floors").querySelectorAll("option").length === 3, "The two fixture floors must be available");
      const dock = "button.fixture_start_auto_empty";
      card.setConfig({ ...config, entities: [dock] });
      setVacuum("docked", {}, { [dock]: { state: "unknown", attributes: {} } }, { button: { press: {} } });
      check(el("basic").textContent.includes("Dock controls"), "Station robot must have a dock action");
      card.setConfig(config);
      setVacuum("unavailable");
      check([...el("modes").querySelectorAll("button")].every(button => button.disabled), "Offline robot must disable task selection");
      setVacuum("cleaning", { started: true }, {}, { vacuum: { start: {}, pause: {}, stop: {}, return_to_base: {} } });
      check(el("basic").querySelector('[data-action="vacuum.pause"]'), "Active task must offer pause");
      setVacuum("error", { error: "Fixture fault" });
      check(root.textContent.includes("Fixture fault"), "An active fault must remain visible");
      update(42, 7, { calibration_points: null });
      check(!el("figure").hidden && el("structured-map").hidden, "Camera image must remain usable when calibration is absent");
      update(43);
      check(!el("figure").hidden && el("structured-map").hidden, "Missing structured frame must keep the camera image");
      update(42, 7, { entity_picture: null });
      check(el("figure").hidden, "Absent camera image must not render an empty map");
      update();
      await waitFor(() => !el("structured-map").hidden);
      const room = el("modes").querySelector('[data-mode="room"]');
      room.focus();
      check(root.activeElement === room, "Room mode must be keyboard focusable");
      check(calls.length === 0, "Reading the matrix scenarios must never send a robot action");
      output.value = `PASS: matrix ${Math.round(card.getBoundingClientRect().width)}px ${dark ? "dark" : "light"}`;
    } catch (error) {
      output.value = `FAIL: ${error.message}`;
      throw error;
    }
  }

  if (params.has("home")) {
    const root = card.shadowRoot;
    const el = id => root.getElementById(id);
    const failures = [];
    const check = (ok, label) => { if (!ok) failures.push(label); };
    const menu = label => [...el("menu-items").querySelectorAll("button")].find(button => button.textContent.trim() === label);
    const hass = card.ha;
    const robot = hass.states[vacuum];
    const updateRobot = (state, attrs) => {
      card.hass = { ...card.ha, states: { ...card.ha.states, [vacuum]: { state, attributes: { ...robot.attributes, ...attrs } } } };
    };
    const brush = "sensor.fixture_main_brush_left", history = "sensor.fixture_cleaning_history";
    card.hass = { ...hass, config: { unit_system: { length: "mi" } }, entities: { ...hass.entities,
      [brush]: { device_id: "robot", platform: "dreame_vacuum", translation_key: "main_brush_left" },
      [history]: { device_id: "robot", platform: "dreame_vacuum", translation_key: "cleaning_history" },
    }, states: { ...hass.states,
      [brush]: { state: "29", attributes: { unit_of_measurement: "%" } },
      [history]: { state: "1", attributes: { "Example session": { timestamp: 1234, completed: true } } },
    } };
    updateRobot("docked", { cleaned_area: 10, charging: true, battery_level: 20 });
    check(el("telemetry").textContent.includes("108ft²"), "Imperial dashboard must report cleaned area in square feet");
    check(el("telemetry").querySelector('[icon="mdi:battery-charging-20"]'), "Charging battery must show its actual level");
    check(Boolean(menu("Cleaning history")) && Boolean(menu("Cruising history")), "Both supported histories must have separate entries");
    check(el("menu").querySelector("summary").dataset.alert === "true", "A consumable below 30% must flag the main menu");
    if (params.has("panel")) {
      const trigger = el("quick").querySelector('[aria-label="Cleaning settings"]');
      trigger.focus();
      trigger.click();
      el("side-panel-back").click();
      check(root.activeElement === trigger, "Returning from settings must restore focus to the opening action");
    }
    updateRobot("cleaning", { started: true, shortcut_task: true });
    check(!menu("Cleaning settings"), "An active shortcut must not offer global tuning");
    updateRobot("cleaning", { started: true, cleangenius: true });
    check(!menu("Cleaning settings"), "An active CleanGenius task must not offer global tuning");
    updateRobot("cleaning", { started: true, scheduled_clean: true });
    check(!menu("Cleaning settings"), "An active scheduled task must not offer global tuning");
    check(calls.length === 0, "Navigation and telemetry must never send robot actions");
    document.querySelector("output").value = failures.length ? `FAIL: ${failures.join("; ")}` : "PASS: home parity";
  }

  if (params.has("yaml")) {
    const root = card.shadowRoot;
    const el = id => root.getElementById(id);
    const configExample = {
      ...config, title: "First floor robot", aspect_ratio: 1.5, full_height: true,
      color_scheme: "dreame_dark", icon_set: "dreame", map_display: "floor_plan", locked: "only_touch",
      touch_lock: 200, disable_haptic: true, left_handed: true, legacy_switches: true,
      scripts: ["script.sweep", "script.quiet"],
      map_config: {
        map_1: {
          object_scale: 7, width: 250, height: 183, opacity: .45,
          hidden_objects: ["customized_cleaning", "floor", "name", "name_background", "no_go", "no_mop", "order", "walls"],
          background_image: { url: "/local/floor.png", left: 77, top: 10.3, width: 250, height: 183, opacity: .75 },
          overlay_image: { url: "/local/upper-walls.png", opacity: .9 },
        },
        map_2: { rotation: 180, opacity: .8 },
      },
      hidden_card_objects: ["title", "state", "status", "animations", "shortcuts", "cruising_history", "saved_notification", "map_change_confirmation"],
      hidden_objects: ["floor", "obstacle", "obstacle_background", "ignored_obstacles", "furniture_image", "path", "pet"],
      override_colors: { floor: "#666", wall: "#444", path: "#ccc", active_area: "#789", no_go: "#900",
        no_mop: "#909", virtual_wall: "#900", carpet: "#315", icon_background: "#222", text: "#ddd",
        segment: [["#246", "#38f"], ["#832", "#e83"], ["#458", "#2bf"], ["#583", "#6a3"]],
        dark: { floor: "#222", wall: "#333", path: "#fff", active_area: "#36d", no_go: "#c00",
          no_mop: "#606", icon_background: "#333", text: "#fff" } },
    };
    const setIndex = (selectedIndex, mapList = [{ id: 7, index: 1 }, { id: 8, index: 2 }]) => {
      const hass = card.ha, bot = hass.states[vacuum];
      card.hass = { ...hass, states: { ...hass.states, [vacuum]: { ...bot,
        attributes: { ...bot.attributes, selected_map_index: selectedIndex, maps: mapList } },
      } };
    };
    const failures = [];
    const check = (ok, message) => { if (!ok) failures.push(message); };
    card.setConfig(configExample);
    setIndex(1);
    for (let frame = 0; frame < 180 && el("structured-map").hidden; frame++) await new Promise(requestAnimationFrame);
    const layer = el("map-layer"), figure = el("figure");
    check(el("title").hidden && el("state").hidden && el("telemetry").hidden, "Combined visibility options must hide all three header elements");
    check(el("cruising-history-detail").hidden && el("shortcuts").querySelectorAll("button").length === 2, "Configured scripts must survive hiding native shortcuts and cruise history");
    check(figure.classList.contains("map-fit") && figure.classList.contains("ratio-frame"), "Map 1 dimensions must coexist with the aspect-ratio frame");
    check(el("structured-map").style.opacity === "0.45" && layer.style.getPropertyValue("--map-object-scale") === "7", "Map 1 must use robot-selected map index, not map ID");
    check(!el("map-background").hidden && !el("map-foreground").hidden && el("map-background").style.opacity === "0.75", "Map 1 art must mount with its configured opacity");
    check(!el("map-objects").querySelector("line.physical-wall, polygon.restricted"), "Map 1 must hide physical walls and restrictions");
    const first = el("map").getBoundingClientRect();
    for (let refresh = 0; refresh < 5; refresh++) setIndex(1);
    const next = el("map").getBoundingClientRect();
    check(Math.abs(first.width - next.width) < 1 && Math.abs(first.height - next.height) < 1, "Identical updates must not change the map dimensions");
    update(42, 8);
    setIndex(undefined);
    check(layer.style.getPropertyValue("--map-opacity") === "0.8" && card.mapRotation === 180, "Map 2 must use the active floor entry index on camera fallback");
    card.setConfig(config);
    check(!el("title").hidden && !el("state").hidden && !el("telemetry").hidden && card.mapRotation === 0
      && el("map-background").hidden && el("map-foreground").hidden && layer.style.getPropertyValue("--map-opacity") === "1",
    "Removing combined YAML options must clear the previous styling");
    check(calls.length === 0, "Loading the complete YAML must not send any commands");
    document.querySelector("output").value = failures.length ? `FAIL: ${failures.join("; ")}` : "PASS: combined YAML";
  }

  if (params.has("settings")) {
    const root = card.shadowRoot;
    const el = id => root.getElementById(id);
    const failures = [];
    const check = (ok, label) => { if (!ok) failures.push(label); };
    const wash = "button.fixture_self_clean", dry = "button.fixture_manual_drying", empty = "button.fixture_start_auto_empty";
    const dryTime = "select.fixture_drying_time";
    const hass = card.ha;
    const washState = { state: "unknown", attributes: {} };
    card.hass = { ...hass, states: { ...hass.states, [wash]: washState, [dry]: washState, [empty]: washState,
      [dryTime]: { state: "2h", attributes: { options: ["2h", "3h"] } } },
    entities: { ...hass.entities, ...Object.fromEntries([
      [wash, "self_clean"], [dry, "manual_drying"], [empty, "start_auto_empty"], [dryTime, "drying_time"],
    ].map(([id, key]) => [id, { device_id: "robot", platform: "dreame_vacuum", translation_key: key }])) },
    services: { ...hass.services, button: { press: {} } } };
    const openDock = () => [...el("basic").querySelectorAll("button")].find(button => button.textContent.includes("Dock controls")).click();
    openDock();
    const tabs = el("dock-content").querySelectorAll("[data-dock-tab]");
    check([...tabs].map(tab => tab.dataset.dockTab).join() === "wash,dry,empty", "Dock must split wash, dry and empty controls");
    tabs[1]?.click();
    check(el("dock-content").querySelector("select")?.value === "2h", "Drying tab must show its device-provided setting");
    const settings = el("dock-content").querySelector("select");
    if (settings) {
      settings.value = "3h";
      settings.dispatchEvent(new Event("change"));
      check(calls.at(-1)?.target.entity_id === dryTime && calls.at(-1)?.payload.option === "3h", "Dock setting must target its own entity");
    }
    el("dock-dialog").close();
    openDock();
    check(el("dock-content").querySelector('[data-dock-tab="dry"]')?.getAttribute("aria-pressed") === "true", "Dock must remember the last tab on reopen");
    el("dock-dialog").close();
    el("quick").querySelector('[aria-label="Cleaning settings"]').click();
    const suction = el("cleaning-settings").querySelector('[aria-label="Suction level"] button');
    suction.focus();
    const stableHass = card.ha, bot = stableHass.states[vacuum];
    card.hass = { ...stableHass, states: { ...stableHass.states, [vacuum]: { ...bot,
      attributes: { ...bot.attributes, battery_level: 81 },
    } } };
    check(root.activeElement === suction && suction.isConnected, "Unrelated telemetry refresh must not replace the focused cleaning control");
    document.querySelector("output").value = failures.length ? `FAIL: ${failures.join("; ")}` : "PASS: settings parity";
  }

  if (params.has("regressions")) {
    const root = card.shadowRoot;
    const el = id => root.getElementById(id);
    const failures = [];
    const check = (ok, message) => { if (!ok) failures.push(message); };
    const roomMode = () => el("modes").querySelector('[data-mode="room"]').click();
    const view = label => [...el("menu-items").querySelectorAll("button")]
      .find(button => button.textContent.trim() === label).click();
    if (!el("map").complete) await new Promise(resolve => el("map").addEventListener("load", resolve, { once: true }));
    check(el("map").naturalWidth === 400 && el("map").naturalHeight === 290, "Calibrated fixture must stay 400×290");
    roomMode();
    view("Map editing and management");
    el("room-markers").querySelector('[data-room="1"]').click();
    const dialog = el("room-dialog");
    check(dialog.open, "Room dialog must open before testing a floor switch");
    update(42, 8);
    check(!dialog.open, "Floor switch must close the stale room dialog");
    if (dialog.open) {
      el("room-name-input").value = "Stale name";
      el("room-name-form").requestSubmit();
    }
    check(calls.length === 0, "A stale rename must not send a service call");
    card.style.maxWidth = "500px";
    card.setConfig({ ...config, mode: "panel" });
    update(42, 7, { calibration_points: null });
    roomMode();
    check(el("rooms").querySelector("input").getBoundingClientRect().width > 0, "Room fallback must be visible without calibration");
    update();
    view("Map editor");
    check(el("map").getBoundingClientRect().width > 0, "Opening graphical editing must leave the narrow map visible");
    el("side-panel-back").click();
    const editor = await card.constructor.getConfigElement();
    const field = name => editor.shadowRoot.querySelector('[name="' + name + '"]');
    editor.setConfig({ entity: vacuum, title: "Previous", full_height: true });
    editor.setConfig({ entity: vacuum });
    check(field("map_display").value === "standard" && field("color_scheme").value === "dreame_light", "Editor defaults must match actual defaults");
    check(!field("title").value && !field("full_height").checked, "Removed config keys must reset editor fields");
    const modeIcon = () => el("modes").querySelector('[data-mode="room"] ha-icon').getAttribute("icon");
    card.setConfig({ ...config, icon_set: "dreame" });
    const dreameIcon = modeIcon();
    card.setConfig({ ...config, icon_set: "material" });
    check(dreameIcon !== modeIcon(), "Icon sets must change rendered glyphs");
    let haptics = 0;
    card.addEventListener("haptic", () => haptics++);
    card.setConfig({ ...config, disable_haptic: false });
    roomMode();
    el("rooms").querySelector("input").click();
    check(haptics === 1, "Room selection must emit interaction haptic feedback");
    card.setConfig({ ...config, disable_haptic: true });
    roomMode();
    el("rooms").querySelector("input").click();
    check(haptics === 1, "Disabled interaction haptics must not emit");
    const layer = el("map-layer");
    const wheel = () => layer.dispatchEvent(new WheelEvent("wheel", { deltaY: -100, cancelable: true }));
    card.setConfig({ ...config, locked: "always" });
    check(wheel(), "Always-locked map must let the dashboard scroll at rest");
    layer.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, clientX: 180, clientY: 120 }));
    check(getComputedStyle(layer).transform !== "none" && !wheel(), "Double click must zoom and unlock the locked map");
    layer.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
    check(getComputedStyle(layer).transform === "none", "Second double click must reset the map");
    card.setConfig({ ...config, locked: "only_touch", touch_lock: 100 });
    const dispatchTouch = (name, positions) => layer.dispatchEvent(new TouchEvent(name, {
      bubbles: true, cancelable: true, touches: positions.map(([x, y], identifier) =>
        new Touch({ identifier, target: layer, clientX: x, clientY: y })),
    }));
    dispatchTouch("touchstart", [[120, 100]]);
    check(dispatchTouch("touchmove", [[120, 125]]), "Immediate one-finger drag must scroll dashboard");
    dispatchTouch("touchend", []);
    dispatchTouch("touchstart", [[120, 100]]);
    await new Promise(resolve => setTimeout(resolve, 135));
    check(!dispatchTouch("touchmove", [[120, 125]]), "Held touch must unlock map pan");
    dispatchTouch("touchend", []);
    dispatchTouch("touchstart", [[120, 100], [160, 100]]);
    check(!dispatchTouch("touchmove", [[100, 100], [180, 100]]) && getComputedStyle(layer).transform !== "none", "Pinch must zoom the map");
    dispatchTouch("touchend", []);
    card.setConfig({ ...config, hidden_objects: ["ignored_obstacles", "pet"], hidden_card_objects: ["saved_notification"] });
    update(42, 7, { obstacles: {
      1: { type: "Cable", x: 250, y: 400, ignore_status: "Manually Ignored" },
      2: { type: "Animal domestique", x: 300, y: 400 },
      3: { type: "Shoe", x: 350, y: 400, ignore_status: "Not Ignored" },
    } });
    const objects = () => [...el("object-markers").children].map(button => button.dataset.object).join(" ");
    for (let frame = 0; frame < 180 && el("structured-map").hidden; frame++) await new Promise(requestAnimationFrame);
    check(objects() === "obstacles:3", "Hidden ignored obstacles and pets must not hide other markers");
    const quick = label => [...el("quick").querySelectorAll("button")].find(button => button.getAttribute("aria-label") === label);
    const setMode = mode => el("modes").querySelector('[data-mode="' + mode + '"]').click();
    check(!quick("Add cleaning area"), "Global mode should not offer a zone");
    setMode("zone");
    check(Boolean(quick("Add cleaning area")), "Zone mode should offer an add-area draft action");
    quick("Add cleaning area")?.click();
    check(!el("target-task").disabled && calls.length === 0, "Adding a zone must create a draft without starting the robot");
    const repeat = quick("Repeats");
    check(Boolean(repeat), "Zone mode should offer task repetitions");
    repeat?.click();
    el("target-task").click();
    check(calls.at(-1)?.payload.repeats === 2, "Zone command must include the chosen repeat count");
    roomMode();
    const settings = quick("Custom room cleaning");
    check(Boolean(settings), "Room mode should offer graphical room cleaning settings");
    if (settings) {
      settings.click();
      const select = el("room-cleaning-settings").querySelector('select[name="suction_level"]');
      check(select?.value === "2", "Visual room settings must show the existing suction level");
      check(el("room-cleaning-settings").querySelector('select[name="mop_pressure"]')?.value === "2",
        "Visual room settings must translate the camera's pressure name to its service code");
      if (select) select.value = "3";
      const fields = el("room-cleaning-settings");
      fields.querySelector('input[type="checkbox"]').click();
      fields.querySelector('button[type="submit"]').click();
      await Promise.resolve();
      check(calls.at(-1)?.payload.segment_id?.join() === "1" && calls.at(-1)?.payload.suction_level?.join() === "3",
        "Visual settings must write only the chosen room and selected value");
      check(!el("result").textContent, "Saved-notification option must suppress a successful save message");
    }
    editor.hass = card.ha;
    editor.setConfig({ entity: vacuum, map_camera: camera, hidden_objects: ["pet"] });
    const toggle = editor.shadowRoot.querySelector('input[data-list="hidden_objects"][value="pet"]');
    check(toggle?.checked, "Visual editor must reflect configured map visibility");
    check(editor.shadowRoot.querySelector("#map-information")?.textContent.includes("7"), "Map inspector must show the current floor identity");
    card.setConfig({ ...config, mode: "default", color_scheme: "mijia_auto" });
    card.hass = { ...card.ha, themes: { darkMode: true } };
    check(root.querySelector(".scheme-mijia.scheme-dreame-dark"), "Automatic Mijia theme must follow the frontend mode");
    update(42, 7, { rooms: {
      1: { name: "Living room", type: 1, index: 0, x0: 150, x1: 400, y0: 250, y1: 650 },
      2: { name: "Kitchen", type: 4, index: 0, x0: 500, x1: 850, y0: 250, y1: 650 },
    } });
    card.hass = { ...card.ha, services: { ...card.ha.services, dreame_vacuum: {
      ...card.ha.services.dreame_vacuum, vacuum_set_segment_type: {},
    } } };
    roomMode();

      rotation.dispatchEvent(new Event("input"));
      rotation.dispatchEvent(new Event("change"));
      require(calls.length === count, "Changing the slider sent a movement command");
      button("remote", "Move one step").click();
      require(calls.length === count + 1 && calls.at(-1).payload.rotation === 30, "Explicit step did not send one movement");

      button("editor", "No-go areas 1").click();
      button("editor", "Remove area").click();
      const stale = button("editor", "Apply map object");
      el("editor").querySelector("input").click();
      el("floors").querySelector("select").value = "8";
      const beforeFloorPrompt = calls.length;
      button("floors", "Switch floor").click();
      const floorDialog = el("floor-dialog");
      require(floorDialog?.open && calls.length === beforeFloorPrompt, "Floor switch did not wait for confirmation");
      floorDialog.close("cancel");
      await new Promise(requestAnimationFrame);
      require(calls.length === beforeFloorPrompt, "Canceling floor confirmation sent a command");
      button("floors", "Switch floor").click();
      const floorHass = card.ha, floorState = floorHass.states[vacuum];
      card.hass = { ...floorHass, states: { ...floorHass.states,
        [vacuum]: { ...floorState, attributes: { ...floorState.attributes, maps: [{ id: 7, name: "Downstairs" }] } },
      } };
      floorDialog.close("confirm");
      await new Promise(requestAnimationFrame);
      require(calls.length === beforeFloorPrompt, "Confirmation tried to switch to a floor no longer listed");
      card.hass = floorHass;
      el("floors").querySelector("select").value = "8";
      button("floors", "Switch floor").click();
      floorDialog.close("confirm");
      await waitFor(() => calls.length > beforeFloorPrompt);
      require(calls.at(-1)?.payload.map_id === 8, "Floor switch did not submit the destination floor");
      const beforeLocalSwitch = calls.length;
      stale.click();
      require(calls.length === beforeLocalSwitch, "Previous floor can still be edited while a switch is pending");
      update(42, 7);
      require(el("editor-detail").hidden, "Old floor state unlocked restrictions before the switch was confirmed");
      update(43, 8);
      const beforeStaleClick = calls.length;
      stale.click();
      require(calls.length === beforeStaleClick, "Stale floor can still send an edit");
      await el("map").decode();
      require(canvas.hidden && getComputedStyle(el("map")).opacity === "1", "Failed to show camera fallback after floor change");
      require(el("map-objects").hidden || !el("map-objects").querySelector("line.door"), "Stale structured door is visible in camera fallback");
      require(el("map-objects").hidden || !el("map-objects").querySelector(".draft"), "Stale draft is still visible");
      update(44, 7);
      await waitFor(() => !canvas.hidden);
      card.setConfig({ ...config, map_display: "floor_plan" });
      require(canvas.hidden && getComputedStyle(el("map")).opacity === "1" && walls().length === 0,
        "Floor-plan mode did not fall back to the camera when physical walls were unavailable");
      card.setConfig(config);
      await waitFor(() => !canvas.hidden);
      const readyHass = card.ha;
      card.setConfig({ ...config, hidden_card_objects: ["map_change_confirmation"] });
      card.hass = { ...readyHass, callService: async () => { throw new Error("Floor change refused"); } };
      el("floors").querySelector("select").value = "8";
      button("floors", "Switch floor").click();
      await waitFor(() => el("result").textContent.includes("Floor change refused"));
      require(!button("floors", "Switch floor").disabled && card.mapPicking,
        "A rejected floor change left the controls or map locked");
      card.hass = readyHass;
      card.setConfig(config);
      await waitFor(() => !canvas.hidden);
      require(isWhite(301, 170) && !isWhite(301, 165) && !isWhite(307, 170),
        "Unknown heading should show a robot without a directional arrow");

      card.style.maxWidth = "320px";
      const longName = "Large dining and living room beside the south-facing windows";
      const overlapping = { name: longName, x0: 150, x1: 400, y0: 250, y1: 650 };
      update(44, 7, { rooms: { 1: overlapping, 2: { ...overlapping, name: "Corner room" } } });
      button("modes", "Rooms").click();
      const longBadge = el("room-markers").querySelector('[data-room="1"]');
      const label = longBadge.querySelector(".room-label");
      require(label.scrollWidth > label.clientWidth && longBadge.getAttribute("aria-label") === longName,
        "A narrow card does not truncate long room labels while preserving their accessible names");
      el("rooms").querySelector('input[value="1"]').click();
      el("rooms").querySelector('input[value="2"]').click();
      require([...el("room-markers").children].every(marker => marker.getAttribute("aria-pressed") === "true"),
        "Overlapping map badges cannot both be selected from the room checklist");

      card.setConfig({ ...config, left_handed: true, hidden_card_objects: ["title", "status", "menu", "task_type"] });
      require(el("title").hidden && !el("state").hidden && el("telemetry").hidden && el("menu").hidden && el("modes").hidden,
        "Configured home controls are not hidden independently");
      require(el("quick").getBoundingClientRect().right <= el("figure").getBoundingClientRect().left,
        "The left-handed action rail is not on the left of the map");
      card.setConfig({ ...config, hidden_card_objects: ["state", "controls", "action_buttons"] });
      require(!el("title").hidden && el("state").hidden && el("modes").hidden && el("basic").hidden && el("quick").hidden,
        "Changing visibility settings left stale home controls");
      card.setConfig(config);

      const scripts = ["script.quiet", "script.sweep"];
      card.setConfig({ ...config, scripts });
      const shortcutNames = id => [...el(id).querySelectorAll("strong")].map(node => node.textContent);
      require(shortcutNames("shortcuts").join() === "Quiet helper,Sweep helper,Kitchen"
        && button("quick", "Shortcuts"), "Scripts did not appear first in the home shortcuts");
      el("shortcuts").querySelector("button").click();
      require(calls.at(-1)?.domain === "script" && calls.at(-1)?.service === "turn_on"
        && calls.at(-1)?.target.entity_id === "script.quiet", "Shortcut did not target the configured script");

      card.setConfig({ ...config, scripts, hidden_card_objects: ["shortcuts"] });
      require(shortcutNames("shortcuts").join() === "Quiet helper,Sweep helper"
        && shortcutNames("device-shortcuts").join() === "Kitchen", "Hiding native shortcuts hid scripts or removed device settings");
      require(el("cruising-history").querySelector("a")?.textContent === "Cruise fixture", "Cruise history fixture was not shown");
      card.setConfig({ ...config, hidden_card_objects: ["cruising_history"] });
      require(!el("cruising-history").querySelector("a") && el("cruising-history-detail").hidden, "Cruise history still appears when hidden");
      card.setConfig(config);
      require(!el("state").hidden && !el("modes").hidden && !el("basic").hidden && !el("quick").hidden,
        "Removing visibility settings does not restore the controls");

      update(44, 7, { map_index: 1 });
      const pathBefore = [...pixel(250, 101)].join();
      card.setConfig({ ...config, hidden_objects: ["walls"],
        map_config: { map_1: { opacity: .45, object_opacity: .4, hidden_objects: ["path", "charger", "furniture", "doors"] } } });
      await waitFor(() => !canvas.hidden);
      require(getComputedStyle(canvas).opacity === "0.45" && !el("map-objects").querySelector("line.door"),
        "Per-floor map opacity or hidden object settings were not applied");
      require(getComputedStyle(el("room-markers")).opacity === "0.4", "Per-floor marker opacity was not applied");
      require(pixel(282, 87)[0] < (dark ? 135 : 210) && !isWhite(76, 77),
        "Hidden furniture or charger is still visible");
      require([...pixel(250, 101)].join() !== pathBefore, "Hidden path is still visible");
      require(pixel(25, 140)[3] === 255, "Floor layer settings did not override global hidden_objects");
      update(44, 7, { map_index: 2 });
      require(getComputedStyle(canvas).opacity === "1" && pixel(25, 140)[3] === 0,
        "An unconfigured map index did not revert to the global layer settings");
      card.setConfig(config);

      card.setConfig({ ...config, override_colors: {
        wall: "#123456", path: "rgba(239,80,30,1)", segment: [["#ff00a0", "#20ef10"]],
        dark: { wall: "#563412" },
      } });
      const wall = dark ? [86, 52, 18] : [18, 52, 86];
      require(wall.every((channel, i) => Math.abs(pixel(25, 140)[i] - channel) <= 2),
        "Wall color override did not respect the dashboard theme");
      require(pixel(249, 101)[0] > 220, "Path color override was not applied");
      button("modes", "Rooms").click();
      const overrideRoom = el("room-markers").querySelector('[data-room="1"]');
      require(pixel(90, 100)[0] > 230 && pixel(90, 100)[1] < 20, "Normal room color override was not applied");
      overrideRoom.click();
      require(pixel(90, 100)[0] < 60 && pixel(90, 100)[1] > 220,
        "Selecting a room did not repaint it with its selected override");
      card.setConfig(config);

      card.setConfig({ ...config, aspect_ratio: 1.5 });
      const frameRect = () => el("figure").getBoundingClientRect();
      require(Math.abs(frameRect().width / frameRect().height - 1.5) < .02, "Configured map frame ratio was not applied");
      const sizedImage = el("map").getBoundingClientRect();
      require(Math.abs(sizedImage.width / sizedImage.height - 400 / 290) < .02
        && sizedImage.height <= frameRect().height + 1, "Custom frame stretched or clipped the calibrated map");
      button("modes", "Rooms").click();
      clickAt(290, 100);
      require(el("room-markers").querySelector('[data-room="2"]').getAttribute("aria-pressed") === "true",
        "Custom frame misaligned map room selection");
      card.setConfig({ ...config, aspect_ratio: .2 });
      const cappedHeight = frameRect().height;
      card.setConfig({ ...config, aspect_ratio: .2, full_height: true });
      require(frameRect().height > cappedHeight && frameRect().height > innerHeight, "full_height did not remove the frame height cap");
      card.setConfig(config);

      card.style.maxWidth = "250px";
      const dock = "button.fixture_start_auto_empty";
      card.hass = { ...card.ha, locale: { language: "fr" }, services: { ...card.ha.services, button: { press: {} } },
        states: { ...card.ha.states, [dock]: { state: "unknown", attributes: {} } } };
      card.setConfig({ ...config, entities: [dock] });
      const primary = [...el("basic").querySelectorAll("button")].filter(node => node.getBoundingClientRect().width);
      require(primary.length === 2 && Math.abs(primary[0].getBoundingClientRect().top - primary[1].getBoundingClientRect().top) <= 1,
        "Primary actions do not share a row on the narrow French card");
      card.setConfig({ ...config, hidden_card_objects: ["map_change_confirmation"] });
      el("floors").querySelector("select").value = "8";
      const beforeDirectSwitch = calls.length;
      el("floors").querySelector("button").click();
      require(!floorDialog.open && calls.length === beforeDirectSwitch + 1 && calls.at(-1).payload.map_id === 8,
        "map_change_confirmation did not skip the optional floor dialog");
      output.value = `PASS: ${config.mode}, ${config.color_scheme}`;
    } catch (error) {
      output.value = `FAIL: ${error.message}`;
      throw error;
    }
  }
</script>
<dreame-open-card></dreame-open-card>
<output></output>
</html>
