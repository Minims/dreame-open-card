<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structured map fixture</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 12px; }
  dreame-open-card { display: block; margin: auto; }
</style>
<script type="module">
  import "/dreame-open-card.js";

  const params = new URLSearchParams(location.search);
  const dark = params.has("dark");
  const card = document.querySelector("dreame-open-card");
  const calls = [];
  const vacuum = "vacuum.fixture", camera = "camera.fixture_map";
  const calibration = [
    { vacuum: { x: 100, y: 200 }, map: { x: 20, y: 260 } },
    { vacuum: { x: 900, y: 200 }, map: { x: 380, y: 260 } },
    { vacuum: { x: 100, y: 700 }, map: { x: 20, y: 30 } },
  ];
  const config = { entity: vacuum, map_camera: camera, map_display: "structured",
    mode: params.has("panel") ? "panel" : "default", color_scheme: dark ? "dreame_dark" : "dreame_light" };
  card.style.maxWidth = params.has("panel") ? "1000px" : "380px";
  document.body.style.background = dark ? "#222" : "#f1f4f7";
  card.setConfig(config);

  function update(frame = 42, floor = 7, restrictions = {}) {
    card.hass = {
      locale: { language: "en" },
      themes: { darkMode: dark },
      states: {
        [vacuum]: { state: "docked", attributes: { friendly_name: "Fixture vacuum", battery_level: 82,
          selected_map_id: floor, maps: [{ id: 7, name: "Downstairs" }, { id: 8, name: "Upstairs" }],
          shortcuts: { 25: { id: 25, name: "Kitchen", tasks: [[{ segment_id: 2 }]] } },
          schedule: [{ id: 1, enabled: true, time: "07:30" }] } },
        [camera]: { state: "idle", attributes: { saved_map_id: floor, map_id: floor * 10 + 1, frame_id: frame,
          entity_picture: `/api/camera_proxy/${camera}?v=${frame}`, calibration_points: calibration,
          cruising_history_picture: { "Cruise fixture": `/api/camera_history_map_proxy/${camera}?v=1234` },
          virtual_walls: [[450, 250, 450, 650]], no_go_areas: [[200, 300, 300, 400]], no_mopping_areas: [],
          rooms: { 1: { name: "Living room", icon: "mdi:sofa-outline", x0: 150, x1: 400, y0: 250, y1: 650 },
            2: { name: "Kitchen", icon: "mdi:stove", x0: 500, x1: 850, y0: 250, y1: 650 } }, ...restrictions } },
        "script.sweep": { state: "off", attributes: { friendly_name: "Sweep helper" } },
        "script.quiet": { state: "off", attributes: { friendly_name: "Quiet helper" } },
      },
      services: {
        vacuum: { start: {}, return_to_base: {} },
        script: { turn_on: {} },
        dreame_vacuum: Object.fromEntries(["clean_segment", "clean_spot", "clean_zone", "goto",
          "set_restricted_zone", "remote_control_move_step", "start_shortcut", "select_map"].map(name => [`vacuum_${name}`, {}])),
      },
      callService: async (domain, service, payload, target) => { calls.push({ domain, service, payload, target }); },
    };
  }

  window.fixture = { card, calls, update };
  update();

  if (params.has("check")) {
    const output = document.querySelector("output");
    const root = card.shadowRoot;
    const el = id => root.getElementById(id);
    const require = (condition, message) => { if (!condition) throw new Error(message); };
    const button = (id, label) => [...el(id).querySelectorAll("button")]
      .find(node => node.textContent.trim() === label || node.getAttribute("aria-label") === label);
    const clickAt = (x, y) => {
      const img = el("map"), rect = img.getBoundingClientRect();
      img.dispatchEvent(new MouseEvent("click", { clientX: rect.left + rect.width * x / 400,
        clientY: rect.top + rect.height * y / 290 }));
    };
    const waitFor = async predicate => {
      for (let i = 0; i < 180; i++) {
        if (predicate()) return;
        await new Promise(requestAnimationFrame);
      }
      throw new Error("Map did not render within 180 frames");
    };
    try {
      const canvas = el("structured-map");
      await waitFor(() => !canvas.hidden);
      const fixtureHass = card.ha;
      card.hass = { ...fixtureHass, entities: {
        [vacuum]: { device_id: "robot" },
        [camera]: { device_id: "robot", platform: "dreame_vacuum", translation_key: "map" },
        "camera.saved": { device_id: "robot", platform: "dreame_vacuum", translation_key: "saved_map" },
        "camera.other_robot": { device_id: "other", platform: "dreame_vacuum", translation_key: "map" },
      } };
      card.setConfig({ entity: vacuum });
      require(!el("figure").hidden && el("map").getAttribute("src") === fixtureHass.states[camera].attributes.entity_picture,
        "Entity-only configuration did not discover the robot's live map camera");
      card.setConfig(config);
      card.hass = fixtureHass;
      await waitFor(() => !canvas.hidden);
      const setRobotName = friendly_name => {
        const state = fixtureHass.states[vacuum];
        card.hass = { ...fixtureHass, entities: { [vacuum]: { device_id: "eve" } },
          devices: { eve: { name: "Eve ", name_by_user: null } },
          states: { ...fixtureHass.states, [vacuum]: { ...state, attributes: { ...state.attributes, friendly_name } } } };
      };
      setRobotName("Eve   Eve ");
      require(el("title").textContent === "Eve", "The device name is repeated in the card title");
      card.setConfig({ ...config, title: "Eve Eve" });
      require(el("title").textContent === "Eve Eve", "The explicit YAML title was changed");
      card.setConfig(config);
      setRobotName("Eve Upstairs");
      require(el("title").textContent === "Eve Upstairs", "A distinct vacuum name was replaced by the device name");
      card.hass = fixtureHass;
      const photoUrl = `/api/camera_map_obstacle_proxy/${camera}?index=1`;
      update(42, 7, { obstacle_picture: { "1: Base": photoUrl, "2: Base": "/api/camera_map_obstacle_proxy/camera.other" }, obstacles: {
        1: { type: "Base", x: 200, y: 400 }, 2: { type: "Base", x: 600, y: 400 },
        3: { type: "Meuble bloquant le robot", x: 800, y: 400 },
      } });
      const obstacles = [...el("object-markers").querySelectorAll('[data-object^="obstacles:"]')];
      const showsLabel = marker => Boolean(marker.querySelector(".obstacle-label")?.getBoundingClientRect().width);
      require(obstacles.length === 3 && obstacles.every(marker => marker.querySelector("ha-icon") && !showsLabel(marker)),
        "Obstacle labels clutter the map before selection");
      obstacles[2].click();
      require(showsLabel(obstacles[2]) && obstacles[2].getAttribute("aria-label") === "Meuble bloquant le robot",
        "Selecting an obstacle did not show its detection label");
      obstacles[0].click();
      require(showsLabel(obstacles[0]) && !showsLabel(obstacles[2]), "More than one obstacle label stays visible");
      obstacles[0].querySelector(".obstacle-label").click();
      const obstacleDialog = el("obstacle-dialog");
      require(obstacleDialog?.open && el("obstacle-photo").getAttribute("src") === photoUrl,
        "The selected obstacle did not open the photo matching its ID");
      await waitFor(() => !el("obstacle-photo").hidden);
      obstacleDialog.close();
      obstacles[1].click();
      obstacles[1].querySelector(".obstacle-label").click();
      require(obstacleDialog.open && !el("obstacle-photo").hasAttribute("src") && !el("obstacle-no-photo").hidden,
        "An obstacle without a safe matching photo did not show the missing-photo state");
      obstacleDialog.close();
      card.hass = fixtureHass;
      const setError = error => {
        const state = fixtureHass.states[vacuum];
        card.hass = { ...fixtureHass, states: {
          ...fixtureHass.states, [vacuum]: { ...state, attributes: { ...state.attributes, error } },
        } };
      };
      const dockedState = el("state").textContent;
      setError("No error");
      require(el("state").textContent === dockedState, "A no-error value appears as a fault in the status");
      setError("Brush stuck");
      require(el("state").textContent.includes("Brush stuck"), "A real vacuum error was hidden");
      card.hass = fixtureHass;
      require(canvas.getBoundingClientRect().right <= el("figure").getBoundingClientRect().right + 1,
        "Map is clipped horizontally");
      const overlay = el("map-objects").querySelector("svg").getBoundingClientRect();
      const map = canvas.getBoundingClientRect();
      require(Math.abs(overlay.width - map.width) <= 1 && Math.abs(overlay.height - map.height) <= 1,
        "Object overlays are not aligned to the rendered map");
      const walls = () => [...el("map-objects").querySelectorAll(".physical-wall")];
      require(walls().length === 0, "Structured mode drew floor-plan walls without being asked");
      card.setConfig({ ...config, map_display: "floor_plan" });
      await waitFor(() => walls().length > 0);
      require(walls().length === 1 && Math.abs(Number(walls()[0].getAttribute("y1")) - 76 / 290 * 100) < .01,
        "Physical walls used original rather than current coordinates or included hidden rooms");
      card.setConfig({ ...config, map_display: "floor_plan", hidden_objects: ["walls"] });
      require(walls().length === 0 && !canvas.hidden, "Hiding walls also disabled the floor-plan renderer");
      card.setConfig(config);
      await waitFor(() => !canvas.hidden);
      update(42, 7, { map_index: 1, rotation: 90 });
      card.setConfig({ ...config, map_config: { map_1: {
        background_image: { url: "/local/floor.png", left: 5.6, top: 9, width: 4, height: 2, opacity: .75 },
        overlay_image: { url: "/local/upper-walls.png", opacity: .9 },
      } } });
      const background = el("map-background"), foreground = el("map-foreground");
      require(background?.getAttribute("src") === "/local/floor.png" && foreground?.getAttribute("src") === "/local/upper-walls.png",
        "The configured floor images were not mounted");
      await Promise.all([background.decode(), foreground.decode()]);
      require(background.style.opacity === "0.75" && foreground.style.opacity === "0.9"
        && Math.abs(parseFloat(background.style.left) - 25.25) < .01 && Math.abs(parseFloat(background.style.width) - 22.5) < .01,
        "Image placement did not use the calibrated grid or configured opacity");
      card.setConfig({ ...config, map_config: { map_1: { rotation: 180 } } });
      require(background.hidden && foreground.hidden && !background.hasAttribute("src"), "Old floor artwork remains after configuration is removed");
      const rotated = el("map").getBoundingClientRect();
      const frame = el("figure").getBoundingClientRect();
      require(Math.abs(rotated.width / rotated.height - 290 / 400) < .02
        && rotated.left >= frame.left - 1 && rotated.right <= frame.right + 1,
        "The per-floor rotation did not override the native angle without clipping");
      button("modes", "Rooms").click();
      el("map").dispatchEvent(new MouseEvent("click", { clientX: rotated.left + rotated.width * (1 - 100 / 290),
        clientY: rotated.top + rotated.height * 290 / 400 }));
      require(el("room-markers").querySelector('[data-room="2"]').getAttribute("aria-pressed") === "true",
        "Clicking a rotated room selected the wrong map point");
      const rotatedBadge = el("room-markers").querySelector('[data-room="2"]').getBoundingClientRect();
      require(rotatedBadge.width > rotatedBadge.height, "A rotated floor turned the room labels sideways");
      button("modes", "Clean a zone").click();
      for (const [x, y] of [[290, 100], [310, 120]]) {
        el("map").dispatchEvent(new MouseEvent("click", { clientX: rotated.left + rotated.width * (1 - y / 290),
          clientY: rotated.top + rotated.height * x / 400 }));
      }
      const firstHandle = () => el("zone-overlay").querySelector("button");
      const oldHandle = firstHandle()?.getBoundingClientRect();
      firstHandle()?.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", cancelable: true }));
      const newHandle = firstHandle()?.getBoundingClientRect();
      require(oldHandle && newHandle && newHandle.left > oldHandle.left && Math.abs(newHandle.top - oldHandle.top) <= 1,
        "The keyboard moved a rotated zone handle in the wrong direction");
      for (const [rotation, x, y] of [[270, 1 - 290 / 400, 1 - 100 / 290], [0, 100 / 290, 1 - 290 / 400]]) {
        card.setConfig({ ...config, aspect_ratio: 1.5, map_config: { map_1: { rotation } } });
        button("modes", "Rooms").click();
        const bounds = el("map").getBoundingClientRect();
        const fitted = el("figure").getBoundingClientRect();
        require(bounds.left >= fitted.left - 1 && bounds.top >= fitted.top - 1
          && bounds.right <= fitted.right + 1 && bounds.bottom <= fitted.bottom + 1, "A rotated floor escaped its configured frame");
        el("map").dispatchEvent(new MouseEvent("click", { clientX: bounds.left + bounds.width * x, clientY: bounds.top + bounds.height * y }));
        require(el("room-markers").querySelector('[data-room="2"]').getAttribute("aria-pressed") === "true",
          "A supported floor rotation misaligned room selection");
      }
      update();
      card.setConfig(config);
      await waitFor(() => !canvas.hidden);
      const room = canvas.getContext("2d").getImageData(90, 100, 1, 1).data;
      const expected = dark ? [66, 99, 140, 255] : [164, 194, 244, 255];
      require(room.every((channel, i) => Math.abs(channel - expected[i]) <= 2), "Room does not render in its configured palette");
      const texture = canvas.getContext("2d").getImageData(201, 142, 1, 1).data;
      const tile = canvas.getContext("2d").getImageData(212, 142, 1, 1).data;
      require(texture.some((channel, i) => Math.abs(channel - tile[i]) > 6), "Tile material does not render its seam");
      const bed = canvas.getContext("2d").getImageData(282, 87, 1, 1).data;
      require(bed[0] > (dark ? 135 : 210) && bed[1] > (dark ? 135 : 210), "Known furniture does not render a light silhouette");
      const pixel = (x, y) => canvas.getContext("2d").getImageData(x, y, 1, 1).data;
      const matchesRoom = (x, y) => pixel(x, y).every((channel, i) => Math.abs(channel - expected[i]) <= 2);
      require(Math.abs(pixel(245, 191)[0] - (dark ? 103 : 204)) <= 2
        && pixel(258, 191)[0] > pixel(245, 191)[0] + 20, "Washing machine is missing its porthole");
      require(pixel(90, 159)[0] > (dark ? 135 : 210) && matchesRoom(89, 145), "Round table is missing its curved footprint");
      require(matchesRoom(142, 172) && matchesRoom(133, 205), "Unknown furniture or furniture in a hidden room was painted");
      require(el("map-objects").querySelector("line.door"), "Physical door is missing from the structured map");
      const isWhite = (x, y) => canvas.getContext("2d").getImageData(x, y, 1, 1).data
        .slice(0, 3).every(channel => channel > 230);
      require(isWhite(301, 165) && !isWhite(307, 170), "Robot pictogram does not point north for heading 90°");
      require(isWhite(76, 77) && !isWhite(69, 71), "Dock pictogram does not have a distinct charging symbol");
      update(42, 7, { calibration_points: calibration.map(({ vacuum, map }) =>
        ({ vacuum, map: { x: 345 - map.y, y: map.x - 55 } })) });
      require(isWhite(179, 246) && !isWhite(175, 240), "Robot heading did not rotate with the calibration");
      update();
      const paintAtEdge = () => canvas.getContext("2d").getImageData(45, 142, 1, 1).data.join();
      const beforeCalibration = paintAtEdge();
      update(42, 7, { calibration_points: calibration.map(point => ({ ...point, map: { ...point.map, x: point.map.x + 20 } })) });
      require(paintAtEdge() !== beforeCalibration, "Canvas ignores a calibration-only update");
      update();
      button("modes", "Rooms").click();
      const living = el("room-markers").querySelector('[data-room="1"]');
      const kitchen = el("room-markers").querySelector('[data-room="2"]');
      require(kitchen.getAttribute("aria-label") === "Kitchen"
        && kitchen.querySelector('ha-icon[icon="mdi:stove"]'), "Room badge is missing its accessible name or integration icon");
      require(getComputedStyle(living).backgroundColor !== getComputedStyle(kitchen).backgroundColor,
        "Unselected room badges do not have distinct room colors");
      const checkmark = kitchen.querySelector(".room-check");
      require(checkmark?.textContent === "✓" && getComputedStyle(checkmark).display === "none",
        "Unselected room has no checkmark state");
      clickAt(290, 100);
      require(kitchen.getAttribute("aria-pressed") === "true" && kitchen.querySelector(".room-order").textContent === "1",
        "Selected room badge does not display its selection order");
      require(getComputedStyle(checkmark).display !== "none", "Selected room is missing its visible checkmark");
      living.focus();
      require(root.activeElement === living, "Room badge cannot receive keyboard focus");
      living.click();
      require(living.querySelector(".room-order").textContent === "2", "Second selected badge has the wrong order");
      kitchen.click();
      require(living.querySelector(".room-order").textContent === "1" && getComputedStyle(checkmark).display === "none",
        "Deselecting the first room did not clear its checkmark and renumber the next room");
      living.click();
      kitchen.click();
      el("target-task").click();
      require(calls.at(-1)?.payload.segments?.[0] === 2, "Pixel selection did not emit room 2");

      button("editor", "Add restricted area").click();
      clickAt(250, 110);
      clickAt(290, 150);
      require(el("map-objects").querySelector(".draft"), "No graphical preview of the restriction");
      require(button("editor", "Apply map object").disabled && el("target-task").disabled, "Draft is not isolated or confirmed");
      el("editor").querySelector("input").click();
      button("editor", "Apply map object").click();
      await Promise.resolve();
      const edit = calls.at(-1);
      require(edit?.service === "vacuum_set_restricted_zone" && edit.payload.no_mops.length === 0
        && edit.payload.walls[0]?.join() === "450,250,450,650"
        && edit.payload.zones[0]?.join() === "200,300,300,400"
        && edit.payload.zones.length === 2, "Restriction did not preserve the existing lists");
      await new Promise(requestAnimationFrame);
      const nextAdd = button("editor", "Add restricted area");
      require(el("editor-detail").hidden || !nextAdd || nextAdd.disabled, "Another edit can overwrite a write that is not visible yet");
      update(42, 7, { no_go_areas: edit.payload.zones });

      el("editor-detail").open = true;
      clickAt(88, 191);
      require(el("map-objects").querySelector("polygon.selected-restriction"), "Tapping an existing restriction did not select it");
      clickAt(97, 176);
      clickAt(114, 204);
      require(el("map-objects").querySelector("polygon.draft") && button("editor", "Apply map object").disabled,
        "Resize is not previewed behind confirmation");
      el("editor").querySelector("input").click();
      button("editor", "Apply map object").click();
      const resize = calls.at(-1)?.payload;
      require(resize?.zones?.[0].every((coord, i) => Math.abs(coord - [271, 322, 309, 383][i]) <= 4)
        && resize.zones[1].join() === edit.payload.zones[1].join() && resize.walls[0].join() === edit.payload.walls[0].join(),
        "Resizing changed more than the selected area");
      await new Promise(requestAnimationFrame);
      update(42, 7, { no_go_areas: resize.zones });

      button("editor", "No-go areas 1").click();
      button("editor", "Remove area").click();
      require(el("map-objects").querySelector("polygon.removal") && button("editor", "Apply map object").disabled,
        "Removal did not show the target and require confirmation");
      el("editor").querySelector("input").click();
      button("editor", "Apply map object").click();
      const removal = calls.at(-1)?.payload;
      require(removal?.zones.length === 1 && removal.zones[0].join() === resize.zones[1].join()
        && removal.walls[0].join() === resize.walls[0].join(), "Removing an area changed other restrictions");
      await new Promise(requestAnimationFrame);
      update(42, 7, { no_go_areas: removal.zones });

      button("shortcuts", "Run shortcut").click();
      require(calls.at(-1)?.payload.shortcut_id === 25, "Shortcut did not use its ID");
      require(!el("schedules").querySelector("button"), "Schedule incorrectly exposes a command");
      const rotation = el("remote").querySelector("input");
      const count = calls.length;
      rotation.value = "30";
      rotation.dispatchEvent(new Event("input"));
      rotation.dispatchEvent(new Event("change"));
      require(calls.length === count, "Changing the slider sent a movement command");
      button("remote", "Move one step").click();
      require(calls.length === count + 1 && calls.at(-1).payload.rotation === 30, "Explicit step did not send one movement");

      button("editor", "No-go areas 1").click();
      button("editor", "Remove area").click();
      const stale = button("editor", "Apply map object");
      el("editor").querySelector("input").click();
      el("floors").querySelector("select").value = "8";
      const beforeFloorPrompt = calls.length;
      button("floors", "Switch floor").click();
      const floorDialog = el("floor-dialog");
      require(floorDialog?.open && calls.length === beforeFloorPrompt, "Floor switch did not wait for confirmation");
      floorDialog.close("cancel");
      await new Promise(requestAnimationFrame);
      require(calls.length === beforeFloorPrompt, "Canceling floor confirmation sent a command");
      button("floors", "Switch floor").click();
      const floorHass = card.ha, floorState = floorHass.states[vacuum];
      card.hass = { ...floorHass, states: { ...floorHass.states,
        [vacuum]: { ...floorState, attributes: { ...floorState.attributes, maps: [{ id: 7, name: "Downstairs" }] } },
      } };
      floorDialog.close("confirm");
      await new Promise(requestAnimationFrame);
      require(calls.length === beforeFloorPrompt, "Confirmation tried to switch to a floor no longer listed");
      card.hass = floorHass;
      el("floors").querySelector("select").value = "8";
      button("floors", "Switch floor").click();
      floorDialog.close("confirm");
      await waitFor(() => calls.length > beforeFloorPrompt);
      require(calls.at(-1)?.payload.map_id === 8, "Floor switch did not submit the destination floor");
      const beforeLocalSwitch = calls.length;
      stale.click();
      require(calls.length === beforeLocalSwitch, "Previous floor can still be edited while a switch is pending");
      update(42, 7);
      require(el("editor-detail").hidden, "Old floor state unlocked restrictions before the switch was confirmed");
      update(43, 8);
      const beforeStaleClick = calls.length;
      stale.click();
      require(calls.length === beforeStaleClick, "Stale floor can still send an edit");
      await el("map").decode();
      require(canvas.hidden && getComputedStyle(el("map")).opacity === "1", "Failed to show camera fallback after floor change");
      require(el("map-objects").hidden || !el("map-objects").querySelector("line.door"), "Stale structured door is visible in camera fallback");
      require(el("map-objects").hidden || !el("map-objects").querySelector(".draft"), "Stale draft is still visible");
      update(44, 7);
      await waitFor(() => !canvas.hidden);
      card.setConfig({ ...config, map_display: "floor_plan" });
      require(canvas.hidden && getComputedStyle(el("map")).opacity === "1" && walls().length === 0,
        "Floor-plan mode did not fall back to the camera when physical walls were unavailable");
      card.setConfig(config);
      await waitFor(() => !canvas.hidden);
      const readyHass = card.ha;
      card.setConfig({ ...config, hidden_card_objects: ["map_change_confirmation"] });
      card.hass = { ...readyHass, callService: async () => { throw new Error("Floor change refused"); } };
      el("floors").querySelector("select").value = "8";
      button("floors", "Switch floor").click();
      await waitFor(() => el("result").textContent.includes("Floor change refused"));
      require(!button("floors", "Switch floor").disabled && card.mapPicking,
        "A rejected floor change left the controls or map locked");
      card.hass = readyHass;
      card.setConfig(config);
      await waitFor(() => !canvas.hidden);
      require(isWhite(301, 170) && !isWhite(301, 165) && !isWhite(307, 170),
        "Unknown heading should show a robot without a directional arrow");

      card.style.maxWidth = "320px";
      const longName = "Large dining and living room beside the south-facing windows";
      const overlapping = { name: longName, x0: 150, x1: 400, y0: 250, y1: 650 };
      update(44, 7, { rooms: { 1: overlapping, 2: { ...overlapping, name: "Corner room" } } });
      button("modes", "Rooms").click();
      const longBadge = el("room-markers").querySelector('[data-room="1"]');
      const label = longBadge.querySelector(".room-label");
      require(label.scrollWidth > label.clientWidth && longBadge.getAttribute("aria-label") === longName,
        "A narrow card does not truncate long room labels while preserving their accessible names");
      el("rooms").querySelector('input[value="1"]').click();
      el("rooms").querySelector('input[value="2"]').click();
      require([...el("room-markers").children].every(marker => marker.getAttribute("aria-pressed") === "true"),
        "Overlapping map badges cannot both be selected from the room checklist");

      card.setConfig({ ...config, left_handed: true, hidden_card_objects: ["title", "status", "menu", "task_type"] });
      require(el("title").hidden && !el("state").hidden && el("telemetry").hidden && el("menu").hidden && el("modes").hidden,
        "Configured home controls are not hidden independently");
      require(el("quick").getBoundingClientRect().right <= el("figure").getBoundingClientRect().left,
        "The left-handed action rail is not on the left of the map");
      card.setConfig({ ...config, hidden_card_objects: ["state", "controls", "action_buttons"] });
      require(!el("title").hidden && el("state").hidden && el("modes").hidden && el("basic").hidden && el("quick").hidden,
        "Changing visibility settings left stale home controls");
      card.setConfig(config);

      const scripts = ["script.quiet", "script.sweep"];
      card.setConfig({ ...config, scripts });
      const shortcutNames = id => [...el(id).querySelectorAll("strong")].map(node => node.textContent);
      require(shortcutNames("shortcuts").join() === "Quiet helper,Sweep helper,Kitchen"
        && button("quick", "Shortcuts"), "Scripts did not appear first in the home shortcuts");
      el("shortcuts").querySelector("button").click();
      require(calls.at(-1)?.domain === "script" && calls.at(-1)?.service === "turn_on"
        && calls.at(-1)?.target.entity_id === "script.quiet", "Shortcut did not target the configured script");

      card.setConfig({ ...config, scripts, hidden_card_objects: ["shortcuts"] });
      require(shortcutNames("shortcuts").join() === "Quiet helper,Sweep helper"
        && shortcutNames("device-shortcuts").join() === "Kitchen", "Hiding native shortcuts hid scripts or removed device settings");
      require(el("photos").querySelector("a")?.textContent === "Cruise fixture", "Cruise history fixture was not shown");
      card.setConfig({ ...config, hidden_card_objects: ["cruising_history"] });
      require(!el("photos").querySelector("a") && el("photos-detail").hidden, "Cruise history still appears when hidden");
      card.setConfig(config);
      require(!el("state").hidden && !el("modes").hidden && !el("basic").hidden && !el("quick").hidden,
        "Removing visibility settings does not restore the controls");

      update(44, 7, { map_index: 1 });
      const pathBefore = [...pixel(250, 101)].join();
      card.setConfig({ ...config, hidden_objects: ["walls"],
        map_config: { map_1: { opacity: .45, object_opacity: .4, hidden_objects: ["path", "charger", "furniture", "doors"] } } });
      await waitFor(() => !canvas.hidden);
      require(getComputedStyle(canvas).opacity === "0.45" && !el("map-objects").querySelector("line.door"),
        "Per-floor map opacity or hidden object settings were not applied");
      require(getComputedStyle(el("room-markers")).opacity === "0.4", "Per-floor marker opacity was not applied");
      require(pixel(282, 87)[0] < (dark ? 135 : 210) && !isWhite(76, 77),
        "Hidden furniture or charger is still visible");
      require([...pixel(250, 101)].join() !== pathBefore, "Hidden path is still visible");
      require(pixel(25, 140)[3] === 255, "Floor layer settings did not override global hidden_objects");
      update(44, 7, { map_index: 2 });
      require(getComputedStyle(canvas).opacity === "1" && pixel(25, 140)[3] === 0,
        "An unconfigured map index did not revert to the global layer settings");
      card.setConfig(config);

      card.setConfig({ ...config, override_colors: {
        wall: "#123456", path: "rgba(239,80,30,1)", segment: [["#ff00a0", "#20ef10"]],
        dark: { wall: "#563412" },
      } });
      const wall = dark ? [86, 52, 18] : [18, 52, 86];
      require(wall.every((channel, i) => Math.abs(pixel(25, 140)[i] - channel) <= 2),
        "Wall color override did not respect the dashboard theme");
      require(pixel(249, 101)[0] > 220, "Path color override was not applied");
      button("modes", "Rooms").click();
      const overrideRoom = el("room-markers").querySelector('[data-room="1"]');
      require(pixel(90, 100)[0] > 230 && pixel(90, 100)[1] < 20, "Normal room color override was not applied");
      overrideRoom.click();
      require(pixel(90, 100)[0] < 60 && pixel(90, 100)[1] > 220,
        "Selecting a room did not repaint it with its selected override");
      card.setConfig(config);

      card.setConfig({ ...config, aspect_ratio: 1.5 });
      const frameRect = () => el("figure").getBoundingClientRect();
      require(Math.abs(frameRect().width / frameRect().height - 1.5) < .02, "Configured map frame ratio was not applied");
      const sizedImage = el("map").getBoundingClientRect();
      require(Math.abs(sizedImage.width / sizedImage.height - 400 / 290) < .02
        && sizedImage.height <= frameRect().height + 1, "Custom frame stretched or clipped the calibrated map");
      button("modes", "Rooms").click();
      clickAt(290, 100);
      require(el("room-markers").querySelector('[data-room="2"]').getAttribute("aria-pressed") === "true",
        "Custom frame misaligned map room selection");
      card.setConfig({ ...config, aspect_ratio: .2 });
      const cappedHeight = frameRect().height;
      card.setConfig({ ...config, aspect_ratio: .2, full_height: true });
      require(frameRect().height > cappedHeight && frameRect().height > innerHeight, "full_height did not remove the frame height cap");
      card.setConfig(config);

      card.style.maxWidth = "250px";
      const dock = "button.fixture_start_auto_empty";
      card.hass = { ...card.ha, locale: { language: "fr" }, services: { ...card.ha.services, button: { press: {} } },
        states: { ...card.ha.states, [dock]: { state: "unknown", attributes: {} } } };
      card.setConfig({ ...config, entities: [dock] });
      const primary = [...el("basic").querySelectorAll("button")].filter(node => node.getBoundingClientRect().width);
      require(primary.length === 2 && Math.abs(primary[0].getBoundingClientRect().top - primary[1].getBoundingClientRect().top) <= 1,
        "Primary actions do not share a row on the narrow French card");
      card.setConfig({ ...config, hidden_card_objects: ["map_change_confirmation"] });
      el("floors").querySelector("select").value = "8";
      const beforeDirectSwitch = calls.length;
      el("floors").querySelector("button").click();
      require(!floorDialog.open && calls.length === beforeDirectSwitch + 1 && calls.at(-1).payload.map_id === 8,
        "map_change_confirmation did not skip the optional floor dialog");
      output.value = `PASS: ${config.mode}, ${config.color_scheme}`;
    } catch (error) {
      output.value = `FAIL: ${error.message}`;
      throw error;
    }
  }
</script>
<dreame-open-card></dreame-open-card>
<output></output>
</html>
